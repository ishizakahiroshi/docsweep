name: Dependency audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install supported runtime extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,mcp,review]"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit installed runtime dependencies
        # A vulnerability or unavailable resolver result must be visible in
        # this scheduled/manual audit.
        run: pip-audit --strict

      - name: Verify audit exit behavior with pinned fixtures
        shell: bash
        run: |
          set -euo pipefail
          if pip-audit --requirement tests/fixtures/dependency-audit/vulnerable.txt --no-deps; then
            echo "::error::the vulnerable fixture unexpectedly passed pip-audit"
            exit 1
          fi
          pip-audit --requirement tests/fixtures/dependency-audit/clean.txt --no-deps
